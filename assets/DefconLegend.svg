        font-weight="700">Critical</text>
  <text x="165" y="29" text-anchor="middle" fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif" font-size="14">DEFCON 1</text>

  <polygon points="87,38 243,38 262,70 68,70" fill="#F57C00"/>
  <text x="165" y="52" text-anchor="middle" fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif" font-size="16"
        font-weight="700">High</text>
  <text x="165" y="65" text-anchor="middle" fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif" font-size="14">DEFCON 2</text>

  <polygon points="64,74 266,74 285,106 45,106" fill="#F9A825"/>
  <text x="165" y="88" text-anchor="middle" fill="#111111"
