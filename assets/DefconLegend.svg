<svg xmlns="http://www.w3.org/2000/svg" width="660" height="364"
     viewBox="0 0 330 182" role="img"
     aria-label="Five labelled enterprise DEFCON pyramid layers">
  <polygon points="110,2 220,2 239,34 91,34" fill="#B71C1C"/>
  <text x="165" y="16" text-anchor="middle" fill="#FFFFFF"
