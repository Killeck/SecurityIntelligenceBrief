name: Daily Security Brief

on:
  schedule:
    # Primary trigger, scheduled well before the actual 07:00 Oslo target
    # to absorb GitHub Actions' documented scheduling delay: "The schedule
    # event can be delayed during periods of high loads of GitHub Actions
    # workflow runs... If the load is sufficiently high enough, some
    # queued jobs may be dropped." Real data from this repo's own run
    # history confirmed a consistent ~5 hour delay (e.g. a 06:17 Oslo
    # trigger actually starting around 11:20 Oslo on 2026-09-16) - a
    # second same-day scheduled trigger did NOT help, since it experienced
    # a similarly severe delay rather than an independent, shorter one.
    # 01:17 Oslo is a deliberate large buffer chosen to still land close
    # to 07:00 Oslo even if the same ~5 hour delay pattern recurs, rather
    # than relying on a second scheduled attempt landing sooner.
    - cron: "17 1 * * *"
      timezone: "Europe/Oslo"
    # Backup trigger, kept at the same 3-hour offset from primary as
    # before. Guarded by the "Check if today's report was already sent"
    # step below: if the primary trigger above already succeeded today,
    # every subsequent step in this run is skipped (no duplicate email).
    # Kept as a safety net for the case where the primary is delayed or
    # dropped even more severely than the buffer above accounts for -
    # costs nothing when unused (the guarded run completes in ~20 seconds).
    - cron: "17 4 * * *"
      timezone: "Europe/Oslo"

  workflow_dispatch:
    inputs:
      lookback_hours:
        description: Use auto, 36 or 72
        required: true
        default: "auto"
        type: string
      kev_lookback_days:
        description: Use auto or a number of calendar days
        required: true
        default: "auto"
        type: string
      max_items:
        description: Maximum number of primary security advisories
        required: true
        default: "40"
        type: string
      discovery_max:
        description: Maximum number of discovery-news links
        required: true
        default: "10"
        type: string
      exposure_max:
        description: Maximum number of exposure and dark-web signals
        required: true
        default: "20"
        type: string

permissions:
  contents: read

concurrency:
  group: daily-security-brief
  cancel-in-progress: false

jobs:
  send-advisory:
    name: Generate and email daily security brief
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Load repository version
        shell: bash
        run: |
          echo "BRIEF_VERSION=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt

      - name: Restore persistent pipeline state
        uses: actions/cache/restore@v6
        with:
          path: .state
          key: daily-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            daily-state-${{ runner.os }}-

      - name: Check if today's report was already sent
        id: check-sent
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          oslo = ZoneInfo("Europe/Oslo")
          today_oslo = datetime.now(timezone.utc).astimezone(oslo).date()

          already_sent = False
          try:
              with open(".state/pipeline_state.json") as handle:
                  state = json.load(handle)
              raw = state.get("daily_last_success")
              if raw:
                  last_success = datetime.fromisoformat(raw)
                  if last_success.tzinfo is None:
                      last_success = last_success.replace(tzinfo=timezone.utc)
                  already_sent = last_success.astimezone(oslo).date() == today_oslo
          except (FileNotFoundError, json.JSONDecodeError, ValueError):
              already_sent = False

          print(f"Today (Europe/Oslo): {today_oslo} | already sent today: {already_sent}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"already-sent={'true' if already_sent else 'false'}\n")
          PY

      - name: Run offline regression tests
        if: steps.check-sent.outputs.already-sent != 'true'
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Verify Gmail delivery configuration
        if: steps.check-sent.outputs.already-sent != 'true'
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python - <<'PY'
          import os
          missing = [key for key in ("GMAIL_USERNAME", "GMAIL_CLIENT_ID", "GMAIL_CLIENT_SECRET", "GMAIL_REFRESH_TOKEN", "EMAIL_TO") if not os.environ.get(key)]
          if missing:
              raise SystemExit("Missing required Gmail delivery secret(s): " + ", ".join(missing))
          print("Gmail delivery configuration present.")
          PY

      - name: Generate and send daily security brief
        if: steps.check-sent.outputs.already-sent != 'true'
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          NVD_MAX_CVES: "75"
          NVD_CACHE_FILE: .state/nvd_cache.json
          NVD_CACHE_TTL_HOURS: "24"

          # Raises the GitHub REST API rate limit from 60/hour (unauthenticated)
          # to 5,000/hour for cisa_csaf.py and ai_security_trackers.py, both of
          # which poll GitHub's Commits/Releases APIs. Auto-provided per-run by
          # GitHub Actions - no new secret to create. Requires the workflow's
          # `permissions:` block to grant at least `contents: read` (already
          # the default) for this token to be usable for API reads.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Optional dark-web and exposure monitoring.
          HIBP_API_KEY: ${{ secrets.HIBP_API_KEY }}
          MONITORED_DOMAINS: ${{ secrets.MONITORED_DOMAINS }}
          MONITORED_BRANDS: ${{ secrets.MONITORED_BRANDS }}

          NEWS_LOOKBACK_HOURS: ${{ inputs.lookback_hours || 'auto' }}
          KEV_LOOKBACK_DAYS: ${{ inputs.kev_lookback_days || 'auto' }}
          NEWS_MAX_ITEMS: ${{ inputs.max_items || '40' }}
          EXEC_NEWS_MAX_ITEMS: ${{ inputs.discovery_max || '10' }}
          EXPOSURE_MAX_ITEMS: ${{ inputs.exposure_max || '20' }}
          EXEC_NEWS_MIN_SCORE: "24"
          UPCOMING_GOVERNANCE_DAYS: "365"
          SOURCE_WORKERS: "16"
          HTML_DETAIL_FETCH_LIMIT: "8"
          DAILY_DEDUP_DAYS: "7"
          DAILY_DEDUP_STATE_FILE: .state/daily_dedup.json
          RUNTIME_PROFILE_FILE: .state/daily_runtime_profile.json
          SOURCE_DEFINITIONS_FILE: config/sources.json

        run: python src/send_security_advisory.py

      - name: Save persistent pipeline state
        if: steps.check-sent.outputs.already-sent != 'true' && success() && hashFiles('.state/**') != ''
        uses: actions/cache/save@v6
        with:
          path: .state
          key: daily-state-${{ runner.os }}-${{ github.run_id }}
