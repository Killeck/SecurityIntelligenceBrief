  <polygon points="18,146 312,146 329,180 1,180" fill="#2E7D32"/>
  <text x="165" y="161" text-anchor="middle" fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif" font-size="16"
        font-weight="700">Low</text>
  <text x="165" y="175" text-anchor="middle" fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif" font-size="14">DEFCON 5</text>
